spring:
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://keycloak:8080/realms/microservices-realm
        registration:
          keycloak-service:
            provider: keycloak
            client-id: delivery-service-client
            client-secret: sRtZSVdLQyOyEFGvBqqN6bE9cySt8srj
            authorization-grant-type: client_credentials
            scope:
              - openid
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/microservices-realm
  datasource:
    url: jdbc:postgresql://postgres-delivery:5432/DeliveryServiceDB
    username: postgres
    password: 1234
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Moscow
  liquibase:
    change-log: classpath:changelog/db.changelog-master.yaml
    enabled: true
  kafka:
    bootstrap-servers: kafka:29092
    consumer:
      group-id: delivery-group
      auto-offset-reset: latest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.type.mapping: "com.utochkin.orderservice.dto.OrderDtoForKafka:com.utochkin.deliveryservice.dto.OrderDtoForKafka"
        spring.json.trusted.packages: "com.utochkin.orderservice.dto,com.utochkin.deliveryservice.dto"
    listener:
      ack-mode: manual_immediate
keycloak:
  admin:
    base-url: http://keycloak:8080/admin/realms/microservices-realm
    target-client-id: spring-microservices
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
delivery:
  timing:
    # 5-минутное окно возврата: T+5 минут после оплаты заказ переводится в DELIVERING
    start-after-minutes: 5
    # «время поездки» курьера (симуляция) до перевода в DELIVERED
    deliver-after-minutes: 2
    # как часто повторять назначение курьера для SEARCHING_COURIER
    reassign-after-minutes: 1
  progress:
    fixed-delay: 30000
  courier-sync:
    fixed-delay: 300000
resilience4j:
  circuitbreaker:
    instances:
      circuitBreakerOrderDelivery:
        registerHealthIndicator: true
        slidingWindowSize: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        recordExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
  retry:
    instances:
      retryOrderDelivery:
        max-attempts: 3
        waitDuration: 10s
        retryExceptions:
          - java.util.concurrent.TimeoutException
          - feign.RetryableException
eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry:    true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
server:
  port: 8186
  forward-headers-strategy: framework
management:
  tracing:
    sampling:
      probability: 0.1
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,trace
  endpoint:
    prometheus:
      access: unrestricted
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
logging:
  level:
    root: INFO
  logstash:
    host: logstash
    port: 5000
