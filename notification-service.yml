spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/microservices-realm
  kafka:
    bootstrap-servers: kafka:29092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.type.mapping: "com.utochkin.orderservice.dto.OrderDtoForKafka:com.utochkin.notificationservice.dto.OrderDtoForKafka"
        spring.json.trusted.packages: "com.utochkin.orderservice.dto,com.utochkin.notificationservice.dto"
    listener:
      ack-mode: manual_immediate
  mail:
    host: smtp.gmail.com
    port: 465
    username: "{cipher}2924bd422f050d42282eaca7a80daf113ef9c6ecf83a0a17c4ec0b8f01635d8c16e940d9fad44935774ce643114c8644"
    password: "{cipher}69d55532306f684f8c76bfabc5a7b3c3b8006b7287792d22df8ba3d422b72766522d632940880a0940a7adc1ac070c81"
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 30000
          writetimeout: 10000
    test-connection: false
eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry:    true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
server:
  port: 8183
management:
  health:
    mail:
      enabled: false
  tracing:
    sampling:
      probability: 0.1
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,trace
  endpoint:
    prometheus:
      access: unrestricted
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
logging:
  level:
    root: INFO
  logstash:
    host: logstash
    port: 5000